name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads the repo. go.sum is committed now, so the old step that pushed
# a generated go.sum back to main (and needed contents: write) is replaced by a
# check that fails if go.mod/go.sum are not tidy.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          # go-ethereum 1.17 needs Go 1.25; read the version from go.mod so the
          # two can never drift apart again.
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: runtime
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
